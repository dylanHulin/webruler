<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRuler - AI Accessibility & WCAG Auditor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WebRuler</h1>
            <p>Powered by Meta Llama • Instant WCAG/RGAA Accessibility Audit & Code Patch Generator</p>
        </header>

        <main>
            <div class="audit-box">
                <input type="url" id="urlInput" placeholder="https://example.com" required>
                <button id="auditBtn" onclick="runAudit()">Run AI Audit</button>
            </div>

            <div id="loader" class="hidden">Analyzing accessibility compliance and generating code fixes...</div>

            <div id="results" class="results-container hidden">
                <h2>Audit Results</h2>
                <div id="summary"></div>
                <div id="violationsList"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
